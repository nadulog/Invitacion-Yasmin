<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 190" width="240" height="190">
  <defs>
    <linearGradient id="shellBody" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.45" stop-color="#e3f3ff" />
      <stop offset="0.8" stop-color="#b4d6f2" />
      <stop offset="1" stop-color="#8fb6dc" />
    </linearGradient>
    <linearGradient id="shellSheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85" />
      <stop offset="0.35" stop-color="#d9d4ff" stop-opacity="0.35" />
      <stop offset="0.65" stop-color="#bff0ff" stop-opacity="0.3" />
      <stop offset="1" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="shellHinge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe6f8" />
      <stop offset="1" stop-color="#86acd2" />
    </linearGradient>
    <radialGradient id="pearlFill" cx="0.36" cy="0.32" r="0.75">
      <stop offset="0" stop-color="#ffffff" />
      <stop offset="0.5" stop-color="#f1f5ff" />
      <stop offset="0.85" stop-color="#c9d6ec" />
      <stop offset="1" stop-color="#9fb2cf" />
    </radialGradient>
    <filter id="shellShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#00142b" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#shellShadow)">
    <!-- cuerpo festoneado -->
    <path d="M120 14
             C 96 14 74 22 58 34
             C 50 30 42 33 40 41
             C 31 41 25 48 26 57
             C 18 60 14 68 17 76
             C 10 81 9 90 14 97
             C 9 104 11 114 19 119
             L 84 160 L 156 160 L 221 119
             C 229 114 231 104 226 97
             C 231 90 230 81 223 76
             C 226 68 222 60 214 57
             C 215 48 209 41 200 41
             C 198 33 190 30 182 34
             C 166 22 144 14 120 14 Z"
          fill="url(#shellBody)" stroke="#ffffff" stroke-opacity="0.7" stroke-width="2" />

    <!-- costillas -->
    <g fill="none" stroke="#7ea7cf" stroke-width="2.4" stroke-linecap="round" opacity="0.6">
      <path d="M120 156 L120 18" />
      <path d="M120 156 L98 20" />
      <path d="M120 156 L142 20" />
      <path d="M120 156 L76 30" />
      <path d="M120 156 L164 30" />
      <path d="M120 156 L56 44" />
      <path d="M120 156 L184 44" />
      <path d="M120 156 L38 62" />
      <path d="M120 156 L202 62" />
      <path d="M120 156 L24 84" />
      <path d="M120 156 L216 84" />
      <path d="M120 156 L18 104" />
      <path d="M120 156 L222 104" />
    </g>
    <g fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" opacity="0.55">
      <path d="M122 150 L122 22" />
      <path d="M100 150 L80 34" />
      <path d="M140 150 L160 34" />
      <path d="M82 148 L42 66" />
      <path d="M158 148 L198 66" />
    </g>

    <!-- brillo nacarado -->
    <path d="M120 14 C 96 14 74 22 58 34 C 50 30 42 33 40 41 C 31 41 25 48 26 57 C 60 50 95 46 120 46 C 145 46 180 50 214 57 C 215 48 209 41 200 41 C 198 33 190 30 182 34 C 166 22 144 14 120 14 Z"
          fill="url(#shellSheen)" />

    <!-- bisagra -->
    <path d="M84 156 L156 156 L146 180 L94 180 Z" fill="url(#shellHinge)" stroke="#ffffff" stroke-opacity="0.5" stroke-width="1.5" />
    <path d="M94 164 H146 M98 171 H142" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.4" stroke-linecap="round" />

    <!-- perla -->
    <circle cx="120" cy="150" r="17" fill="url(#pearlFill)" stroke="#ffffff" stroke-opacity="0.8" stroke-width="1.2" />
    <ellipse cx="113" cy="143" rx="5.5" ry="4" fill="#ffffff" opacity="0.9" />
    <circle cx="126" cy="157" r="2.2" fill="#ffffff" opacity="0.5" />
  </g>
</svg>
